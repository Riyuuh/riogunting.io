        window.onload = function() {
            loadStaticEntries();
            loadDynamicEntries();
        };

        function loadStaticEntries() {
            const container = document.getElementById('staticEntries');
            container.innerHTML = STATIC_ENTRIES.map(entry => {
                const dateStr = new Date(entry.date).toLocaleDateString('en-PH');
                const imagesHtml = entry.images.length > 1 ? 
                    `<div class="multi-images">${entry.images.map(img => `<img src="${img}" alt="${entry.title}">`).join('')}</div>` :
                    `<img src="${entry.images[0]}" alt="${entry.title}">`;
                
                const featuredClass = entry.featured ? 'featured' : '';
                
                return `
                    <article class="diary-entry ${featuredClass}">
                        <h3>📅 ${dateStr} - ${entry.title}</h3>
                        <p>${entry.content}</p>
                        ${imagesHtml}
                    </article>
                `;
            }).join('');
        }

        function loadDynamicEntries() {
            const entries = JSON.parse(localStorage.getItem('fullDiaryEntries')) || [];
            const container = document.getElementById('dynamicEntriesSection');
            
            if (entries.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <h3 style="color: #DAA520; margin: 40px 0 25px; text-align: center; border-bottom: 2px solid #DAA520; padding-bottom: 10px;">📱 Recently Saved Entries (${entries.length})</h3>
                ${entries.slice(0, 8).map(entry => `
                    <article class="diary-entry full-entry">
                        <div class="entry-header">
                            <span class="entry-date">${new Date(entry.date).toLocaleDateString('en-PH')}</span>
                            <span class="entry-time">${entry.timestamp}</span>
                        </div>
                        <h3>${entry.title}</h3>
                        <p>${entry.content.substring(0, 200)}${entry.content.length > 200 ? '...' : ''}</p>
                        ${entry.photo ? `<img src="${entry.photo}" alt="Entry photo" class="full-entry-photo">` : ''}
                        <div class="entry-actions-full">
                            <button onclick="viewFullEntry(${entry.id})" class="btn small secondary">👁️ View Full</button>
                            <button onclick="deleteFullEntry(${entry.id})" class="btn small danger">🗑️ Delete</button>
                        </div>
                    </article>
                `).join('')}
            `;
        }

        function deleteFullEntry(id) {
            if (confirm('🗑️ Delete this entry forever?')) {
                let entries = JSON.parse(localStorage.getItem('fullDiaryEntries')) || [];
                entries = entries.filter(e => e.id != id);
                localStorage.setItem('fullDiaryEntries', JSON.stringify(entries));
                loadDynamicEntries();
            }
        }

        function viewFullEntry(id) {
            const entries = JSON.parse(localStorage.getItem('fullDiaryEntries')) || [];
            const entry = entries.find(e => e.id == id);
            if (entry) {
                const fullContent = `📝 ${entry.title}\n\n${entry.content}\n\n💾 Saved: ${entry.timestamp}`;
                alert(fullContent);
            }
        }
